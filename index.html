<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Management System · Enterprise HR Portal</title>
<meta name="description" content="Enterprise-grade employee records, daily attendance punch, leave workflows, automated payroll calculation, and interactive reporting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --card-elevated:#ffffff;
  --ink:#0f172a;
  --ink-secondary:#475569;
  --mute:#64748b;
  --line:#e2e8f0;
  --line-strong:#cbd5e1;
  --pri:#2563eb;
  --pri-hover:#1d4ed8;
  --pri-light:#eff6ff;
  --pri-border:#bfdbfe;
  --ok:#059669;
  --ok-light:#ecfdf5;
  --ok-border:#a7f3d0;
  --bad:#dc2626;
  --bad-light:#fef2f2;
  --bad-border:#fecaca;
  --warn:#d97706;
  --warn-light:#fffbeb;
  --warn-border:#fde68a;
  --info:#0284c7;
  --info-light:#f0f9ff;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow:0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
  --radius:12px;
  --radius-lg:16px;
  --radius-full:9999px;
  --transition:all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#090d16;
    --card:#111827;
    --card-elevated:#1e293b;
    --ink:#f8fafc;
    --ink-secondary:#cbd5e1;
    --mute:#94a3b8;
    --line:#1e293b;
    --line-strong:#334155;
    --pri-light:#1e3a8a33;
    --pri-border:#1e3a8a;
    --ok-light:#064e3b33;
    --ok-border:#065f46;
    --bad-light:#7f1d1d33;
    --bad-border:#991b1b;
    --warn-light:#78350f33;
    --warn-border:#92400e;
    --info-light:#082f4933;
    --shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.4);
    --shadow:0 4px 6px -1px rgb(0 0 0 / 0.4);
    --shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.5);
  }
}
[data-theme="dark"]{
  --bg:#090d16;
  --card:#111827;
  --card-elevated:#1e293b;
  --ink:#f8fafc;
  --ink-secondary:#cbd5e1;
  --mute:#94a3b8;
  --line:#1e293b;
  --line-strong:#334155;
  --pri-light:#1e3a8a33;
  --pri-border:#1e3a8a;
  --ok-light:#064e3b33;
  --ok-border:#065f46;
  --bad-light:#7f1d1d33;
  --bad-border:#991b1b;
  --warn-light:#78350f33;
  --warn-border:#92400e;
  --info-light:#082f4933;
}
[data-theme="light"]{
  --bg:#f8fafc;
  --card:#ffffff;
  --card-elevated:#ffffff;
  --ink:#0f172a;
  --ink-secondary:#475569;
  --mute:#64748b;
  --line:#e2e8f0;
  --line-strong:#cbd5e1;
  --pri-light:#eff6ff;
  --pri-border:#bfdbfe;
  --ok-light:#ecfdf5;
  --ok-border:#a7f3d0;
  --bad-light:#fef2f2;
  --bad-border:#fecaca;
  --warn-light:#fffbeb;
  --warn-border:#fde68a;
  --info-light:#f0f9ff;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size:14px;
  line-height:1.55;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* Header & Nav */
header{
  background:var(--card);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:40;
  box-shadow:var(--shadow-sm);
}
.header-inner{
  max-width:1280px;
  margin:0 auto;
  padding:10px 20px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  justify-content:space-between;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:inherit;
  cursor:pointer;
}
.brand-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  background:linear-gradient(135deg, #2563eb, #1d4ed8);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:17px;
  box-shadow:0 2px 4px rgba(37,99,235,0.3);
}
.brand-text b{
  font-size:15px;
  font-weight:700;
  letter-spacing:-0.2px;
  display:block;
  line-height:1.2;
}
.brand-text span{
  font-size:11px;
  color:var(--mute);
  font-weight:500;
}
nav{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  align-items:center;
}
nav button{
  background:none;
  border:0;
  color:var(--ink-secondary);
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font:inherit;
  font-weight:600;
  font-size:13.5px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:var(--transition);
}
nav button:hover{
  background:var(--bg);
  color:var(--ink);
}
nav button.on{
  background:var(--pri-light);
  color:var(--pri);
}
.user-menu{
  display:flex;
  align-items:center;
  gap:10px;
}
.user-badge{
  display:flex;
  align-items:center;
  gap:8px;
  padding:4px 8px 4px 4px;
  border-radius:var(--radius-full);
  background:var(--bg);
  border:1px solid var(--line);
}
.user-avatar{
  width:28px;
  height:28px;
  border-radius:var(--radius-full);
  background:var(--pri);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:11px;
}
.user-name{
  font-size:12.5px;
  font-weight:600;
  color:var(--ink);
  line-height:1.2;
}
.role-badge{
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:var(--radius-full);
  letter-spacing:0.5px;
}
.role-Admin{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.role-HR{background:#e0e7ff;color:#3730a3;border:1px solid #c7d2fe}
.role-Employee{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.role-Guest{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}

/* Layout */
main{
  max-width:1280px;
  margin:0 auto;
  padding:24px 20px 48px;
}
.page-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:16px;
  margin-bottom:20px;
}
.page-title h1{
  margin:0;
  font-size:24px;
  font-weight:800;
  letter-spacing:-0.5px;
  color:var(--ink);
}
.page-title p{
  margin:4px 0 0;
  color:var(--mute);
  font-size:13.5px;
}
.page-actions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

/* Cards & Grid */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:20px;
  margin-bottom:20px;
  box-shadow:var(--shadow-sm);
  transition:var(--transition);
}
.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  gap:12px;
}
.card-title{
  font-size:16px;
  font-weight:700;
  color:var(--ink);
  margin:0;
  display:flex;
  align-items:center;
  gap:8px;
}
.grid{
  display:grid;
  gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
}
.stat-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:18px 20px;
  box-shadow:var(--shadow-sm);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  overflow:hidden;
}
.stat-card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:4px;
  height:100%;
  background:var(--pri);
}
.stat-card.ok::before{background:var(--ok)}
.stat-card.warn::before{background:var(--warn)}
.stat-card.info::before{background:var(--info)}
.stat-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.stat-title{
  color:var(--mute);
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.stat-icon{
  width:32px;
  height:32px;
  border-radius:8px;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--mute);
}
.stat-value{
  font-size:28px;
  font-weight:800;
  letter-spacing:-0.5px;
  color:var(--ink);
  line-height:1.2;
}
.stat-sub{
  font-size:12px;
  color:var(--mute);
  margin-top:6px;
}

/* Buttons & Links */
button.b,a.b{
  background:var(--pri);
  color:#fff;
  border:0;
  border-radius:var(--radius);
  padding:8px 16px;
  cursor:pointer;
  font:inherit;
  font-size:13.5px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  box-shadow:var(--shadow-sm);
  transition:var(--transition);
}
button.b:hover,a.b:hover{
  background:var(--pri-hover);
  box-shadow:var(--shadow);
  transform:translateY(-1px);
}
button.b:active,a.b:active{
  transform:translateY(0);
}
button.g,a.g{
  background:var(--card);
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:var(--radius);
  padding:7px 14px;
  cursor:pointer;
  font:inherit;
  font-size:13px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  transition:var(--transition);
}
button.g:hover,a.g:hover{
  background:var(--bg);
  border-color:var(--line-strong);
}
button.danger{
  background:var(--bad-light);
  border:1px solid var(--bad-border);
  color:var(--bad);
}
button.danger:hover{
  background:var(--bad);
  color:#fff;
}
button.success{
  background:var(--ok-light);
  border:1px solid var(--ok-border);
  color:var(--ok);
}
button.success:hover{
  background:var(--ok);
  color:#fff;
}
button.sm,a.sm{padding:5px 10px;font-size:12px;border-radius:6px}
button.icon-btn{padding:7px;border-radius:8px}

/* Forms & Inputs */
input,select,textarea{
  font:inherit;
  font-size:13.5px;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  color:var(--ink);
  width:100%;
  transition:var(--transition);
}
input:focus,select:focus,textarea:focus{
  outline:0;
  border-color:var(--pri);
  box-shadow:0 0 0 3px var(--pri-light);
}
.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:16px;
}
.row>*{flex:1;min-width:160px}
.row>button,.row>a{flex:none}
form.fg{
  display:grid;
  gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
}
form.fg label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--mute);
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.input-group{
  display:flex;
  flex-direction:column;
}

/* Tables */
.table-wrapper{
  overflow-x:auto;
  border-radius:var(--radius-lg);
  border:1px solid var(--line);
  background:var(--card);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px;
}
th{
  background:var(--bg);
  color:var(--mute);
  font-size:11.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.5px;
  text-align:left;
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
td{
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
  color:var(--ink);
}
tr:last-child td{border-bottom:0}
tbody tr{
  transition:var(--transition);
}
tbody tr:hover{
  background:var(--bg);
}

/* Status Tags & Badges */
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 10px;
  border-radius:var(--radius-full);
  font-size:11.5px;
  font-weight:700;
  line-height:1.2;
}
.tag::before{
  content:'';
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
}
.tag.Active,.tag.Present,.tag.Approved,.tag.Paid{
  background:var(--ok-light);
  color:var(--ok);
  border:1px solid var(--ok-border);
}
.tag.Rejected,.tag.Absent,.tag.Inactive{
  background:var(--bad-light);
  color:var(--bad);
  border:1px solid var(--bad-border);
}
.tag.Pending,.tag.Late,.tag.On\ Leave,.tag.Half-Day{
  background:var(--warn-light);
  color:var(--warn);
  border:1px solid var(--warn-border);
}
.tag.Casual{background:#e0e7ff;color:#3730a3;border:1px solid #c7d2fe}
.tag.Sick{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.tag.PaidLeave{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.tag.Unpaid{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}

/* Charts & Bars */
.bl{
  display:grid;
  grid-template-columns:140px 1fr 100px;
  gap:12px;
  align-items:center;
  margin:10px 0;
}
.bl span{
  font-size:13px;
  font-weight:600;
  color:var(--ink-secondary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.bar-track{
  height:10px;
  border-radius:var(--radius-full);
  background:var(--bg);
  overflow:hidden;
  position:relative;
}
.bar{
  height:100%;
  border-radius:var(--radius-full);
  background:linear-gradient(90deg, var(--pri), #3b82f6);
  min-width:6px;
  transition:width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.bl b{
  font-size:13px;
  font-weight:700;
  text-align:right;
}

/* Modals & Dialogs */
dialog{
  border:0;
  border-radius:var(--radius-lg);
  padding:0;
  width:min(680px, 94vw);
  background:var(--card);
  color:var(--ink);
  box-shadow:var(--shadow-lg);
}
dialog::backdrop{
  background:rgba(15, 23, 42, 0.65);
  backdrop-filter:blur(4px);
}
.modal-header{
  padding:20px 24px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.modal-header h2{
  margin:0;
  font-size:18px;
  font-weight:800;
  letter-spacing:-0.3px;
}
.modal-body{
  padding:24px;
  max-height:75vh;
  overflow-y:auto;
}
.modal-footer{
  padding:16px 24px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:10px;
  background:var(--bg);
}

/* Toast System */
#toast-container{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:10px;
  pointer-events:none;
}
.toast{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 18px;
  box-shadow:var(--shadow-lg);
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13.5px;
  font-weight:600;
  min-width:280px;
  max-width:400px;
  pointer-events:auto;
  animation:toastIn 0.25s ease-out;
  transition:all 0.2s ease;
}
.toast.success{border-left:4px solid var(--ok);color:var(--ink)}
.toast.error{border-left:4px solid var(--bad);color:var(--ink)}
.toast.info{border-left:4px solid var(--info);color:var(--ink)}
@keyframes toastIn{
  from{transform:translateX(100%);opacity:0}
  to{transform:translateX(0);opacity:1}
}

/* Login View */
.login-container{
  max-width:480px;
  margin:8vh auto;
  text-align:center;
}
.login-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:36px 32px;
  box-shadow:var(--shadow);
}
.login-logo{
  width:56px;
  height:56px;
  border-radius:14px;
  background:linear-gradient(135deg, #2563eb, #1d4ed8);
  color:#fff;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:24px;
  margin-bottom:16px;
  box-shadow:0 8px 16px rgba(37,99,235,0.25);
}
.role-select-btn{
  width:100%;
  margin:10px 0;
  padding:14px 18px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  color:var(--ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  transition:var(--transition);
}
.role-select-btn:hover{
  border-color:var(--pri);
  background:var(--pri-light);
  transform:translateY(-1px);
}
.role-select-btn b{display:block;font-size:14px}
.role-select-btn small{color:var(--mute);font-size:12px}

/* Slide Viewer */
.slide-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:32px;
  box-shadow:var(--shadow-sm);
  min-height:420px;
  position:relative;
}
.slide-badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:var(--radius-full);
  background:var(--pri-light);
  color:var(--pri);
  border:1px solid var(--pri-border);
  font-size:11px;
  font-weight:700;
  letter-spacing:0.5px;
  text-transform:uppercase;
  margin-bottom:12px;
}
.slide-title{
  font-size:24px;
  font-weight:800;
  color:var(--ink);
  margin:0 0 6px;
}
.slide-subtitle{
  font-size:14px;
  color:var(--mute);
  margin-bottom:24px;
}

/* Pagination */
.pagination{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  border-top:1px solid var(--line);
  flex-wrap:wrap;
  gap:10px;
}

@media print{
  header,#toast-container,.noprint{display:none !important}
  main{padding:0}
  dialog{position:static;width:100%;box-shadow:none;border:0}
  .modal-body{max-height:none;overflow:visible}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<div id="toast-container"></div>

/* ---------- Toast Notification Engine ---------- */
function toast(msg, type = 'success') {
  const c = $('#toast-container');
  if (!c) return;
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  t.innerHTML = `<span style="font-weight:800;color:${type==='success'?'var(--ok)':type==='error'?'var(--bad)':'var(--info)'}">${icon}</span><span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateY(-10px)';
    setTimeout(() => t.remove(), 200);
  }, 3200);
}

/* ---------- Data Layer: REST API + LocalStorage Fallback ---------- */
async function boot() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) throw 0;
    S = await r.json();
    live = true;
  } catch {
    const l = localStorage.getItem('ems');
    if (l) {
      try { S = JSON.parse(l); } catch { S = JSON.parse(JSON.stringify(SEED)); }
    } else {
      try {
        const f = await fetch('data.json');
        S = f.ok ? await f.json() : JSON.parse(JSON.stringify(SEED));
      } catch {
        S = JSON.parse(JSON.stringify(SEED));
      }
    }
  }
  render();
}

async function commit(col, op, item) {
  const L = S[col] || [];
  if (op === 'add') L.unshift(item);
  if (op === 'upd') {
    const idx = L.findIndex((x) => x.id === item.id);
    if (idx >= 0) L[idx] = item;
  }
  if (op === 'del') {
    S[col] = L.filter((x) => x.id !== item);
    if (col === 'employees') {
      for (const c of ['attendance', 'leaves', 'payroll']) {
        if (S[c]) S[c] = S[c].filter((x) => x.employeeId !== item);
      }
    }
  }
  if (op === 'all') S[col] = item;

  if (live) {
    const u = '/api/' + col;
    const headers = { 'Content-Type': 'application/json', 'X-User-Role': role || 'Guest' };
    const m = { add: [u, 'POST'], upd: [`${u}/${item?.id}`, 'PUT'], del: [`${u}/${item}`, 'DELETE'], all: [u, 'PUT'] }[op];
    try {
      const res = await fetch(m[0], { method: m[1], headers, body: op === 'del' ? undefined : JSON.stringify(item) });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        toast(err.error || 'Server error', 'error');
        return false;
      }
    } catch {
      localStorage.setItem('ems', JSON.stringify(S));
    }
  } else {
    localStorage.setItem('ems', JSON.stringify(S));
  }
  render();
  return true;
}

    const matchDept = !empDept || e.department === empDept;
    const matchStatus = !empStatus || e.status === empStatus;
    const matchRole = !empRole || e.role === empRole;
    return matchQ && matchDept && matchStatus && matchRole;
  });

  // Sorting
  filtered.sort((a, b) => {
    if (empSort === 'name-asc') return name(a).localeCompare(name(b));
    if (empSort === 'name-desc') return name(b).localeCompare(name(a));
    if (empSort === 'code') return a.employeeCode.localeCompare(b.employeeCode);
    if (empSort === 'salary-desc') return (b.salary?.basic || 0) - (a.salary?.basic || 0);
    if (empSort === 'salary-asc') return (a.salary?.basic || 0) - (b.salary?.basic || 0);
    return 0;
  });

  // Pagination
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / empPerPage));
  if (empPage > totalPages) empPage = totalPages;

/* Attendance Punch In & Out */
async function punch() {
  const u = me(), d = today(), late = new Date().getHours() >= 10;
  if ((S.attendance || []).some((a) => a.employeeId === u.id && a.date === d)) {
    toast('Already punched in today.', 'error');
    return;
  }
  const item = {
    id: 'att-' + Date.now(),
    employeeId: u.id,
    employeeName: name(u),
    department: u.department,
    date: d,
    checkIn: now(),
    checkOut: '-',
    status: late ? 'Late' : 'Present',
    workHours: 0,
    notes: 'Self web punch'
  };
  const ok = await commit('attendance', 'add', item);
  if (ok) toast(`Punched in at ${item.checkIn} (${item.status})`, 'success');
}

async function punchOut() {
  const u = me(), d = today();
  const a = (S.attendance || []).find((x) => x.employeeId === u.id && x.date === d);
  if (!a) {
    toast('No active punch record found for today.', 'error');
    return;
  }
  const t = now();
  let hrs = 8.5;
  try {
    const parseTime = (s) => {
      const [hm, ap] = s.split(' ');
      let [h, m] = hm.split(':').map(Number);
      if (ap === 'PM' && h < 12) h += 12;
      if (ap === 'AM' && h === 12) h = 0;
      return h * 60 + m;
    };
    hrs = Math.max(0.5, Math.round(((parseTime(t) - parseTime(a.checkIn)) / 60) * 10) / 10);
  } catch {}
  
  const updated = { ...a, checkOut: t, workHours: hrs };
  const ok = await commit('attendance', 'upd', updated);
  if (ok) toast(`Punched out at ${t}. Shift duration: ${hrs} hours.`, 'success');
}

function setAtt(id, status) {
  const item = (S.attendance || []).find((a) => a.id === id);
  if (item) {
    commit('attendance', 'upd', { ...item, status });
    toast(`Attendance status updated to ${status}`, 'success');
  }
}

/* Leave Application & Review */
async function applyLeave(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target), u = me();
  const s = f.get('s'), e = f.get('e'), t = f.get('t'), r = f.get('r');

  if (new Date(e) < new Date(s)) {
    toast('End date must be on or after start date.', 'error');
    return;
  }

  const days = Math.max(1, Math.round((new Date(e) - new Date(s)) / 864e5) + 1);
  const key = { Casual: 'casual', Sick: 'sick', Paid: 'paid' }[t];
  if (key && u.leaveBalance && u.leaveBalance[key] < days) {
    toast(`Insufficient ${t} leave balance (${u.leaveBalance[key]} days remaining, ${days} requested).`, 'error');
    return;
  }

  const item = {
    id: 'leave-' + Date.now(),
    employeeId: u.id,
    employeeName: name(u),
    department: u.department,
    leaveType: t,
    startDate: s,
    endDate: e,
    days,
    reason: r,
    status: 'Pending',
    appliedOn: today()
  };

  const ok = await commit('leaves', 'add', item);
  if (ok) toast(`Leave application submitted (${days} days)`, 'success');
}

async function review(id, status) {
  const l = (S.leaves || []).find((x) => x.id === id), u = me();
  if (!l) return;
  await commit('leaves', 'upd', { ...l, status, reviewedBy: `${name(u)} (${role})`, reviewedAt: `${today()} ${now()}` });
  
  const key = { Casual: 'casual', Sick: 'sick', Paid: 'paid' }[l.leaveType];
  const emp = (S.employees || []).find((e) => e.id === l.employeeId);
  if (status === 'Approved' && key && emp && emp.leaveBalance) {
    await commit('employees', 'upd', {
      ...emp,
      leaveBalance: { ...emp.leaveBalance, [key]: Math.max(0, emp.leaveBalance[key] - l.days) }
    });
  }
  toast(`Leave request for ${l.employeeName} marked as ${status}`, status === 'Approved' ? 'success' : 'info');
}

async function saveEmp(ev, id) {
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  const old = (S.employees || []).find((x) => x.id === id);

  // Validate duplicate employee code
  const codeExists = (S.employees || []).some((e) => e.id !== id && e.employeeCode.toLowerCase() === f.employeeCode.trim().toLowerCase());
  if (codeExists) {
    toast(`Employee code ${f.employeeCode} already exists.`, 'error');
    return;
  }

  // Validate duplicate email
  const emailExists = (S.employees || []).some((e) => e.id !== id && e.email.toLowerCase() === f.email.trim().toLowerCase());
  if (emailExists) {
    toast(`Email ${f.email} is already in use.`, 'error');
    return;
  }

  const record = {
    leaveBalance: { casual: 8, sick: 8, paid: 12 },
    bankDetails: { accountNumber: '•••• •••• 9012', bankName: 'HDFC Bank', ifsc: 'HDFC0001234' },
    ...old,
    id: id || 'emp-' + Date.now(),
    employeeCode: f.employeeCode.trim(),
    firstName: f.firstName.trim(),
    lastName: f.lastName.trim(),
    email: f.email.trim(),
    phone: f.phone?.trim() || '',
    department: f.department,
    designation: f.designation.trim(),
    joiningDate: f.joiningDate,
    role: f.role,
    status: f.status,
    salary: {
      taxRate: 10,
      pfRate: 12,
      ...old?.salary,
      basic: Number(f.basic) || 0,
      hra: Number(f.hra) || 0,
      allowances: Number(f.allowances) || 0
    }
  };

  $('#dlg').close();
  const ok = await commit('employees', id ? 'upd' : 'add', record);
  if (ok) toast(`Employee ${record.firstName} ${record.lastName} saved successfully`, 'success');
}

/* Automated Payroll Engine */
async function runPayroll() {
  const month = new Date().toLocaleString('en', { month: 'long', year: 'numeric' });
  const activeEmps = (S.employees || []).filter((e) => e.status !== 'Inactive');

  const batch = activeEmps.map((e) => {
    const { basic, hra, allowances, taxRate, pfRate } = e.salary || { basic: 30000, hra: 12000, allowances: 5000, taxRate: 10, pfRate: 12 };
    const gross = basic + hra + allowances;
    const leave = e.status === 'On Leave';
    const tax = Math.round(gross * (taxRate || 10) / 100);
    const pf = Math.round(basic * (pfRate || 12) / 100);
    const penalty = leave ? 2100 : 0;
    const totalDeductions = tax + pf + penalty;
    const netSalary = gross - totalDeductions;

    return {
      id: `pay-${e.id}-${month.replace(' ', '')}`,
      employeeId: e.id,
      employeeName: name(e),
      department: e.department,
      designation: e.designation,
      month,
      payDate: today(),
      basicSalary: basic,
      hra,
      specialAllowance: allowances,
      grossSalary: gross,
      taxDeduction: tax,
      pfDeduction: pf,
      attendancePenalty: penalty,
      totalDeductions,
      netSalary,
      status: 'Paid',
      workingDays: 22,
      presentDays: leave ? 20 : 22,
      paidLeaveDays: leave ? 2 : 0
    };
  });

  const updatedPayroll = [...batch, ...(S.payroll || []).filter((p) => p.month !== month)];
  const ok = await commit('payroll', 'all', updatedPayroll);
  if (ok) toast(`Payroll processed for ${month} (${batch.length} employees)`, 'success');
}

/* CSV Data Exports */
function exportCSV() {
  const rows = [
    ['Employee Code', 'First Name', 'Last Name', 'Email', 'Phone', 'Department', 'Designation', 'Role', 'Status', 'Basic Salary'],
    ...(S.employees || []).map((e) => [
      e.employeeCode, e.firstName, e.lastName, e.email, e.phone || '', e.department, e.designation, e.role, e.status, e.salary?.basic || 0
    ])
  ];
  downloadCSV(rows, `employees_master_${today()}.csv`);
  toast('Employees CSV downloaded', 'success');
}

function exportAttendanceCSV() {
  const rows = [
    ['Employee Code', 'Employee Name', 'Department', 'Date', 'Check-In', 'Check-Out', 'Work Hours', 'Status', 'Notes'],
    ...(S.attendance || []).map((a) => {
      const emp = (S.employees || []).find((e) => e.id === a.employeeId);
      return [emp?.employeeCode || '—', a.employeeName, a.department, a.date, a.checkIn, a.checkOut || '—', a.workHours || 0, a.status, a.notes || '—'];
    })
  ];
  downloadCSV(rows, `attendance_logs_${today()}.csv`);
  toast('Attendance CSV downloaded', 'success');
}

function exportPayrollCSV() {
  const rows = [
    ['Employee Name', 'Department', 'Designation', 'Month', 'Pay Date', 'Basic', 'HRA', 'Allowances', 'Gross', 'Tax', 'PF', 'Penalty', 'Net Pay', 'Status'],
    ...(S.payroll || []).map((p) => [
      p.employeeName, p.department, p.designation, p.month, p.payDate, p.basicSalary, p.hra, p.specialAllowance, p.grossSalary, p.taxDeduction, p.pfDeduction, p.attendancePenalty, p.netSalary, p.status
    ])
  ];
  downloadCSV(rows, `payroll_records_${today()}.csv`);
  toast('Payroll CSV downloaded', 'success');
}

function downloadCSV(rows, filename) {
  const csvContent = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const a = Object.assign(document.createElement('a'), { download: filename, href: URL.createObjectURL(blob) });
  a.click();
}
