<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Management System</title>
<meta name="description" content="Employee records, attendance, leave and payroll in one web app.">
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--pri:#2563eb;--ok:#059669;--bad:#dc2626;--warn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#111a2e;--ink:#e2e8f0;--mute:#94a3b8;--line:#1e293b}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#0f172a;color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px;position:sticky;top:0;z-index:5}
header b{font-size:16px;margin-right:12px}nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;color:#cbd5e1;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,nav button:hover{background:#1e3a8a;color:#fff}
main{max-width:1180px;margin:0 auto;padding:20px}h2{margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat small{color:var(--mute)}.stat div{font-size:26px;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:12px;text-transform:uppercase}.scroll{overflow-x:auto}
button.b,a.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit}
button.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit}
.ok{background:var(--ok)}.bad{background:var(--bad)}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row>*{flex:1;min-width:140px}.row>button{flex:none}
form.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}form.fg label{font-size:12px;color:var(--mute)}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--line)}
.Active,.Present,.Approved,.Paid{color:var(--ok)}.Rejected,.Absent,.Inactive{color:var(--bad)}.Pending,.Late,.On\ Leave{color:var(--warn)}
.bar{height:10px;border-radius:5px;background:var(--pri);min-width:4px}.bl{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;margin:6px 0}
dialog{border:0;border-radius:14px;padding:22px;width:min(680px,94vw);background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}
.login{max-width:420px;margin:12vh auto;text-align:center}.login button{display:block;width:100%;margin:10px 0;padding:14px}
.mode{font-size:12px;color:#94a3b8}
@media print{header,.noprint{display:none}dialog{box-shadow:none;width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');
const today = () => new Date().toISOString().slice(0, 10);
const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const COLS = ['employees', 'attendance', 'leaves', 'payroll'];
let S = {}, live = false, role = sessionStorage.getItem('role'), tab = 'dashboard', q = '';

/* ---------- data layer: REST API when server.js is running, localStorage otherwise ---------- */
async function boot() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) throw 0;
    S = await r.json(); live = true;
  } catch {
    const l = localStorage.getItem('ems');
    S = l ? JSON.parse(l) : await (await fetch('data.json')).json();
  }
  render();
}
async function commit(col, op, item) { // op: add | upd | del | all
  const L = S[col];
  if (op === 'add') L.unshift(item);
  if (op === 'upd') L[L.findIndex((x) => x.id === item.id)] = item;
  if (op === 'del') {
    S[col] = L.filter((x) => x.id !== item);
    if (col === 'employees') for (const c of ['attendance', 'leaves', 'payroll']) S[c] = S[c].filter((x) => x.employeeId !== item);
  }
  if (op === 'all') S[col] = item;
  if (live) {
    const u = '/api/' + col, j = { 'Content-Type': 'application/json' };
    const m = { add: [u, 'POST'], upd: [`${u}/${item?.id}`, 'PUT'], del: [`${u}/${item}`, 'DELETE'], all: [u, 'PUT'] }[op];
    await fetch(m[0], { method: m[1], headers: j, body: op === 'del' ? undefined : JSON.stringify(item) }).catch(() => alert('Server unreachable'));
  } else localStorage.setItem('ems', JSON.stringify(S));
  render();
}

/* ---------- helpers ---------- */
const me = () => S.employees.find((e) => e.role === role && (role !== 'Employee' || e.id === 'emp-003')) || S.employees.find((e) => e.role === role) || S.employees[0];
const staff = () => role !== 'Employee';
const name = (e) => `${e.firstName} ${e.lastName}`;
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const group = (a, f) => a.reduce((m, x) => ((m[f(x)] = (m[f(x)] || []).concat(x)), m), {});
const bars = (obj, fmt = (v) => v) => { const mx = Math.max(1, ...Object.values(obj));
  return Object.entries(obj).map(([k, v]) => `<div class="bl"><span>${esc(k)}</span><div class="bar" style="width:${(v / mx) * 100}%"></div><b>${fmt(v)}</b></div>`).join('') || '<p class="mode">No data</p>'; };

/* ---------- views ---------- */
function login() {
  return `<div class="login card"><h2>Employee Management System</h2><p class="mode">Choose a role to sign in${live ? ' (API connected)' : ' (demo mode, data saved in this browser)'}</p>
  ${['Admin', 'HR', 'Employee'].map((r) => `<button class="b" onclick="signIn('${r}')">Continue as ${r}</button>`).join('')}</div>`;
}
function dashboard() {
  const E = S.employees, pend = S.leaves.filter((l) => l.status === 'Pending');
  const mine = S.attendance.find((a) => a.employeeId === me().id && a.date === today());
  return `<h2>Dashboard</h2><div class="grid">
  <div class="card stat"><small>Employees</small><div>${E.length}</div></div>
  <div class="card stat"><small>Active</small><div>${E.filter((e) => e.status === 'Active').length}</div></div>
  <div class="card stat"><small>On leave</small><div>${E.filter((e) => e.status === 'On Leave').length}</div></div>
  <div class="card stat"><small>Pending leave requests</small><div>${pend.length}</div></div>
  <div class="card stat"><small>Monthly gross</small><div>${inr(sum(E, (e) => e.salary.basic + e.salary.hra + e.salary.allowances))}</div></div></div>
  <div class="card"><b>Today:</b> ${mine ? `checked in at ${esc(mine.checkIn)} <span class="tag ${mine.status}">${mine.status}</span>` : `You haven't punched in yet. <button class="b" onclick="punch()">Punch in</button>`}</div>
  <div class="card"><b>Headcount by department</b>${bars(Object.fromEntries(Object.entries(group(E, (e) => e.department)).map(([k, v]) => [k, v.length])))}</div>`;
}
function employees() {
  const list = S.employees.filter((e) => (name(e) + e.department + e.designation + e.employeeCode).toLowerCase().includes(q.toLowerCase()));
  return `<h2>Employee Directory</h2><div class="row"><input placeholder="Search name, department, code" value="${esc(q)}" oninput="q=this.value;render(true)">
  ${staff() ? `<button class="b" onclick="empForm()">+ Add employee</button>` : ''}</div>
  <div class="card scroll"><table><tr><th>Code<th>Name<th>Department<th>Designation<th>Role<th>Status<th></tr>
  ${list.map((e) => `<tr><td>${esc(e.employeeCode)}<td>${esc(name(e))}<br><small class="mode">${esc(e.email)}</small><td>${esc(e.department)}<td>${esc(e.designation)}<td>${e.role}<td><span class="${e.status}">${e.status}</span>
  <td>${staff() ? `<button class="g" onclick="empForm('${e.id}')">Edit</button> ${role === 'Admin' ? `<button class="g" onclick="delEmp('${e.id}')">Delete</button>` : ''}` : ''}`).join('')}</table></div>`;
}
function attendance() {
  const A = staff() ? S.attendance : S.attendance.filter((a) => a.employeeId === me().id);
  const L = staff() ? S.leaves : S.leaves.filter((l) => l.employeeId === me().id);
  return `<h2>Attendance & Leave</h2><div class="card"><button class="b" onclick="punch()">Punch in now</button></div>
  <div class="card scroll"><b>Attendance log</b><table><tr><th>Employee<th>Date<th>In<th>Out<th>Hours<th>Status</tr>
  ${A.map((a) => `<tr><td>${esc(a.employeeName)}<td>${a.date}<td>${esc(a.checkIn)}<td>${esc(a.checkOut || '-')}<td>${a.workHours ?? '-'}
  <td>${staff() ? `<select onchange="setAtt('${a.id}',this.value)">${['Present', 'Late', 'Half-Day', 'Absent', 'On Leave'].map((s) => `<option${s === a.status ? ' selected' : ''}>${s}`).join('')}</select>` : `<span class="${a.status}">${a.status}</span>`}`).join('')}</table></div>
  <div class="card"><b>Apply for leave</b><form class="fg" onsubmit="applyLeave(event)" style="margin-top:10px">
  <div><label>Type</label><select name="t"><option>Casual<option>Sick<option>Paid<option>Unpaid</select></div>
  <div><label>From</label><input type="date" name="s" value="${today()}" required></div><div><label>To</label><input type="date" name="e" value="${today()}" required></div>
  <div><label>Reason</label><input name="r" required></div><div style="align-self:end"><button class="b">Submit</button></div></form></div>
  <div class="card scroll"><b>Leave requests</b><table><tr><th>Employee<th>Type<th>Dates<th>Days<th>Reason<th>Status<th></tr>
  ${L.map((l) => `<tr><td>${esc(l.employeeName)}<td>${l.leaveType}<td>${l.startDate} to ${l.endDate}<td>${l.days}<td>${esc(l.reason)}<td><span class="${l.status}">${l.status}</span>
  <td>${staff() && l.status === 'Pending' ? `<button class="b ok" onclick="review('${l.id}','Approved')">Approve</button> <button class="b bad" onclick="review('${l.id}','Rejected')">Reject</button>` : ''}`).join('')}</table></div>`;
}
function payroll() {
  const P = staff() ? S.payroll : S.payroll.filter((p) => p.employeeId === me().id);
  return `<h2>Payroll</h2>${staff() ? `<div class="row"><button class="b" onclick="runPayroll()">Run payroll for ${new Date().toLocaleString('en', { month: 'long', year: 'numeric' })}</button></div>` : ''}
  <div class="card scroll"><table><tr><th>Employee<th>Month<th>Gross<th>Deductions<th>Net<th>Status<th></tr>
  ${P.map((p) => `<tr><td>${esc(p.employeeName)}<td>${p.month}<td>${inr(p.grossSalary)}<td>${inr(p.totalDeductions)}<td><b>${inr(p.netSalary)}</b><td><span class="${p.status}">${p.status}</span><td><button class="g" onclick="payslip('${p.id}')">Payslip</button>`).join('')}</table></div>`;
}
function reports() {
  const dep = group(S.employees, (e) => e.department);
  const cnt = (a, f) => Object.fromEntries(Object.entries(group(a, f)).map(([k, v]) => [k, v.length]));
  return `<h2>Reports</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
  <div class="card"><b>Gross payroll by department</b>${bars(Object.fromEntries(Object.entries(dep).map(([k, v]) => [k, sum(v, (e) => e.salary.basic + e.salary.hra + e.salary.allowances)])), inr)}</div>
  <div class="card"><b>Attendance status</b>${bars(cnt(S.attendance, (a) => a.status))}</div>
  <div class="card"><b>Leave requests</b>${bars(cnt(S.leaves, (l) => l.status))}</div>
  <div class="card"><b>Employees by status</b>${bars(cnt(S.employees, (e) => e.status))}</div></div>
  <button class="b" onclick="exportCSV()">Download employees CSV</button>`;
}

/* ---------- render ---------- */
const views = { dashboard, employees, attendance, payroll, reports };
function render(keepFocus) {
  if (!role) { $('#app').innerHTML = login(); return; }
  const f = keepFocus && document.activeElement?.tagName === 'INPUT';
  $('#app').innerHTML = `<header><b>EMS</b><nav>${Object.keys(views).filter((t) => t !== 'reports' || staff()).map((t) => `<button class="${t === tab ? 'on' : ''}" onclick="tab='${t}';render()">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</nav>
  <span class="mode">${esc(name(me()))} (${role}) · ${live ? 'API' : 'demo'}</span><button class="g" style="color:#fff;border-color:#334155" onclick="signOut()">Sign out</button></header><main>${views[tab]()}</main>`;
  if (f) { const i = $('main input'); i.focus(); i.setSelectionRange(99, 99); }
}

/* ---------- actions ---------- */
function signIn(r) { role = r; sessionStorage.setItem('role', r); tab = 'dashboard'; render(); }
function signOut() { role = null; sessionStorage.removeItem('role'); render(); }
function punch() {
  const u = me(), d = today(), late = new Date().getHours() >= 10;
  if (S.attendance.some((a) => a.employeeId === u.id && a.date === d)) return alert('Already punched in today.');
  commit('attendance', 'add', { id: 'att-' + Date.now(), employeeId: u.id, employeeName: name(u), department: u.department, date: d, checkIn: now(), status: late ? 'Late' : 'Present', workHours: 0, notes: 'Web punch' });
}
function setAtt(id, status) { commit('attendance', 'upd', { ...S.attendance.find((a) => a.id === id), status }); }
function applyLeave(ev) {
  ev.preventDefault(); const f = new FormData(ev.target), u = me();
  const days = Math.max(1, Math.round((new Date(f.get('e')) - new Date(f.get('s'))) / 864e5) + 1);
  commit('leaves', 'add', { id: 'leave-' + Date.now(), employeeId: u.id, employeeName: name(u), department: u.department, leaveType: f.get('t'), startDate: f.get('s'), endDate: f.get('e'), days, reason: f.get('r'), status: 'Pending', appliedOn: today() });
}
async function review(id, status) {
  const l = S.leaves.find((x) => x.id === id), u = me();
  await commit('leaves', 'upd', { ...l, status, reviewedBy: `${name(u)} (${role})`, reviewedAt: `${today()} ${now()}` });
  const key = { Casual: 'casual', Sick: 'sick', Paid: 'paid' }[l.leaveType], emp = S.employees.find((e) => e.id === l.employeeId);
  if (status === 'Approved' && key && emp) commit('employees', 'upd', { ...emp, leaveBalance: { ...emp.leaveBalance, [key]: Math.max(0, emp.leaveBalance[key] - l.days) } });
}
function empForm(id) {
  const e = S.employees.find((x) => x.id === id) || { salary: { basic: 30000, hra: 10000, allowances: 5000, taxRate: 10, pfRate: 12 }, role: 'Employee', status: 'Active', joiningDate: today() };
  const i = (k, l, v, t = 'text') => `<div><label>${l}</label><input name="${k}" type="${t}" value="${esc(v)}" required></div>`;
  const s = (k, l, v, o) => `<div><label>${l}</label><select name="${k}">${o.map((x) => `<option${x === v ? ' selected' : ''}>${x}`).join('')}</select></div>`;
  $('#dlg').innerHTML = `<h2>${id ? 'Edit' : 'Add'} employee</h2><form class="fg" onsubmit="saveEmp(event,'${id || ''}')">
  ${i('firstName', 'First name', e.firstName || '')}${i('lastName', 'Last name', e.lastName || '')}${i('email', 'Email', e.email || '', 'email')}${i('phone', 'Phone', e.phone || '')}
  ${i('department', 'Department', e.department || '')}${i('designation', 'Designation', e.designation || '')}${i('joiningDate', 'Joining date', e.joiningDate, 'date')}
  ${s('role', 'Role', e.role, ['Employee', 'HR', 'Admin'])}${s('status', 'Status', e.status, ['Active', 'On Leave', 'Inactive'])}
  ${i('basic', 'Basic salary', e.salary.basic, 'number')}${i('hra', 'HRA', e.salary.hra, 'number')}${i('allowances', 'Allowances', e.salary.allowances, 'number')}
  <div style="grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end"><button type="button" class="g" onclick="$('#dlg').close()">Cancel</button><button class="b">Save</button></div></form>`;
  $('#dlg').showModal();
}
function saveEmp(ev, id) {
  ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)), old = S.employees.find((x) => x.id === id);
  const e = { leaveBalance: { casual: 8, sick: 8, paid: 12 }, bankDetails: { accountNumber: '', bankName: '', ifsc: '' }, ...old,
    id: id || 'emp-' + Date.now(), employeeCode: old?.employeeCode || 'EMS-' + (101 + S.employees.length),
    ...Object.fromEntries(['firstName', 'lastName', 'email', 'phone', 'department', 'designation', 'joiningDate', 'role', 'status'].map((k) => [k, f[k]])),
    salary: { taxRate: 10, pfRate: 12, ...old?.salary, basic: +f.basic, hra: +f.hra, allowances: +f.allowances } };
  $('#dlg').close(); commit('employees', id ? 'upd' : 'add', e);
}
function delEmp(id) { if (confirm('Delete this employee and all related records?')) commit('employees', 'del', id); }
function runPayroll() {
  const month = new Date().toLocaleString('en', { month: 'long', year: 'numeric' });
  const batch = S.employees.filter((e) => e.status !== 'Inactive').map((e) => {
    const { basic, hra, allowances, taxRate, pfRate } = e.salary, gross = basic + hra + allowances, leave = e.status === 'On Leave';
    const tax = Math.round(gross * taxRate / 100), pf = Math.round(basic * pfRate / 100), pen = leave ? 2100 : 0;
    return { id: `pay-${e.id}-${month.replace(' ', '')}`, employeeId: e.id, employeeName: name(e), department: e.department, designation: e.designation, month, payDate: today(),
      basicSalary: basic, hra, specialAllowance: allowances, grossSalary: gross, taxDeduction: tax, pfDeduction: pf, attendancePenalty: pen, totalDeductions: tax + pf + pen,
      netSalary: gross - tax - pf - pen, status: 'Paid', workingDays: 22, presentDays: leave ? 20 : 22, paidLeaveDays: leave ? 2 : 0 };
  });
  commit('payroll', 'all', [...batch, ...S.payroll.filter((p) => p.month !== month)]);
}
function payslip(id) {
  const p = S.payroll.find((x) => x.id === id), r = (a, b) => `<tr><td>${a}<td style="text-align:right">${inr(b)}`;
  $('#dlg').innerHTML = `<h2>Payslip · ${p.month}</h2><p><b>${esc(p.employeeName)}</b><br>${esc(p.designation)}, ${esc(p.department)}<br>Pay date ${p.payDate} · Present ${p.presentDays}/${p.workingDays} days</p>
  <table>${r('Basic', p.basicSalary)}${r('HRA', p.hra)}${r('Allowances', p.specialAllowance)}${r('<b>Gross</b>', p.grossSalary)}${r('Tax', -p.taxDeduction)}${r('Provident fund', -p.pfDeduction)}${r('Attendance penalty', -p.attendancePenalty)}${r('<b>Net pay</b>', p.netSalary)}</table>
  <div class="noprint" style="margin-top:14px;text-align:right"><button class="g" onclick="$('#dlg').close()">Close</button> <button class="b" onclick="print()">Print</button></div>`;
  $('#dlg').showModal();
}
function exportCSV() {
  const rows = [['Code', 'Name', 'Email', 'Department', 'Designation', 'Role', 'Status', 'Basic'], ...S.employees.map((e) => [e.employeeCode, name(e), e.email, e.department, e.designation, e.role, e.status, e.salary.basic])];
  const a = Object.assign(document.createElement('a'), { download: 'employees.csv', href: URL.createObjectURL(new Blob([rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' })) });
  a.click();
}
boot();
</script>
</body>
</html>
