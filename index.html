/* ---------- Data Layer: REST API when available, LocalStorage otherwise ---------- */
async function boot() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) throw 0;
    S = await r.json(); live = true;
  } catch {
    const l = localStorage.getItem('ems');
    if (l) {
      try { S = JSON.parse(l); } catch { S = JSON.parse(JSON.stringify(SEED)); }
    } else {
      try {
        const f = await fetch('data.json');
        S = f.ok ? await f.json() : JSON.parse(JSON.stringify(SEED));
      } catch {
        S = JSON.parse(JSON.stringify(SEED));
      }
    }
  }
  render();
}

async function commit(col, op, item) { // op: add | upd | del | all
  const L = S[col];
  if (op === 'add') L.unshift(item);
  if (op === 'upd') {
    const idx = L.findIndex((x) => x.id === item.id);
    if (idx >= 0) L[idx] = item;
  }
  if (op === 'del') {
    S[col] = L.filter((x) => x.id !== item);
    if (col === 'employees') for (const c of ['attendance', 'leaves', 'payroll']) S[c] = S[c].filter((x) => x.employeeId !== item);
  }
  if (op === 'all') S[col] = item;

  if (live) {
    const u = '/api/' + col, j = { 'Content-Type': 'application/json' };
    const m = { add: [u, 'POST'], upd: [`${u}/${item?.id}`, 'PUT'], del: [`${u}/${item}`, 'DELETE'], all: [u, 'PUT'] }[op];
    try {
      await fetch(m[0], { method: m[1], headers: j, body: op === 'del' ? undefined : JSON.stringify(item) });
    } catch {
      localStorage.setItem('ems', JSON.stringify(S));
    }
  } else {
    localStorage.setItem('ems', JSON.stringify(S));
  }
  render();
}

function punch() {
  const u = me(), d = today(), late = new Date().getHours() >= 10;
  if ((S.attendance || []).some((a) => a.employeeId === u.id && a.date === d)) return alert('Already punched in today.');
  commit('attendance', 'add', {
    id: 'att-' + Date.now(),
    employeeId: u.id,
    employeeName: name(u),
    department: u.department,
    date: d,
    checkIn: now(),
    checkOut: '-',
    status: late ? 'Late' : 'Present',
    workHours: 0,
    notes: 'Web punch'
  });
}

function punchOut() {
  const u = me(), d = today();
  const a = (S.attendance || []).find((x) => x.employeeId === u.id && x.date === d);
  if (!a) return;
  const t = now();
  let hrs = 8.5;
  try {
    const parseTime = (s) => {
      const [hm, ap] = s.split(' ');
      let [h, m] = hm.split(':').map(Number);
      if (ap === 'PM' && h < 12) h += 12;
      if (ap === 'AM' && h === 12) h = 0;
      return h * 60 + m;
    };
    hrs = Math.max(0.5, Math.round(((parseTime(t) - parseTime(a.checkIn)) / 60) * 10) / 10);
  } catch {}
  commit('attendance', 'upd', { ...a, checkOut: t, workHours: hrs });
}

function setAtt(id, status) {
  const item = (S.attendance || []).find((a) => a.id === id);
  if (item) commit('attendance', 'upd', { ...item, status });
}

function applyLeave(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target), u = me();
  const s = f.get('s'), e = f.get('e');
  if (new Date(e) < new Date(s)) return alert('End date must be on or after start date.');
  const days = Math.max(1, Math.round((new Date(e) - new Date(s)) / 864e5) + 1);
  commit('leaves', 'add', {
    id: 'leave-' + Date.now(),
    employeeId: u.id,
    employeeName: name(u),
    department: u.department,
    leaveType: f.get('t'),
    startDate: s,
    endDate: e,
    days,
    reason: f.get('r'),
    status: 'Pending',
    appliedOn: today()
  });
}

async function review(id, status) {
  const l = (S.leaves || []).find((x) => x.id === id), u = me();
  if (!l) return;
  await commit('leaves', 'upd', { ...l, status, reviewedBy: `${name(u)} (${role})`, reviewedAt: `${today()} ${now()}` });
  const key = { Casual: 'casual', Sick: 'sick', Paid: 'paid' }[l.leaveType];
  const emp = (S.employees || []).find((e) => e.id === l.employeeId);
  if (status === 'Approved' && key && emp && emp.leaveBalance) {
    commit('employees', 'upd', { ...emp, leaveBalance: { ...emp.leaveBalance, [key]: Math.max(0, emp.leaveBalance[key] - l.days) } });
  }
}

function empForm(id) {
  const e = (S.employees || []).find((x) => x.id === id) || { salary: { basic: 30000, hra: 12000, allowances: 5000, taxRate: 10, pfRate: 12 }, role: 'Employee', status: 'Active', joiningDate: today() };
  const i = (k, l, v, t = 'text') => `<div><label>${l}</label><input name="${k}" type="${t}" value="${esc(v)}" required></div>`;
  const s = (k, l, v, o) => `<div><label>${l}</label><select name="${k}">${o.map((x) => `<option${x === v ? ' selected' : ''}>${x}`).join('')}</select></div>`;
  $('#dlg').innerHTML = `<h2>${id ? 'Edit Employee Record' : 'Add New Employee'}</h2><form class="fg" onsubmit="saveEmp(event,'${id || ''}')">
  ${i('firstName', 'First Name', e.firstName || '')}${i('lastName', 'Last Name', e.lastName || '')}${i('email', 'Email Address', e.email || '', 'email')}${i('phone', 'Phone Number', e.phone || '')}
  ${i('department', 'Department', e.department || '')}${i('designation', 'Designation', e.designation || '')}${i('joiningDate', 'Joining Date', e.joiningDate || today(), 'date')}
  ${s('role', 'System Role', e.role, ['Employee', 'HR', 'Admin'])}${s('status', 'Employment Status', e.status, ['Active', 'On Leave', 'Inactive'])}
  ${i('basic', 'Basic Salary (₹)', e.salary?.basic || 30000, 'number')}${i('hra', 'HRA (₹)', e.salary?.hra || 12000, 'number')}${i('allowances', 'Allowances (₹)', e.salary?.allowances || 5000, 'number')}
  <div style="grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    <button type="button" class="g" onclick="$('#dlg').close()">Cancel</button>
    <button class="b">Save Employee Record</button>
  </div></form>`;
  $('#dlg').showModal();
}

function saveEmp(ev, id) {
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target)), old = (S.employees || []).find((x) => x.id === id);
  const e = {
    leaveBalance: { casual: 8, sick: 8, paid: 12 },
    bankDetails: { accountNumber: '', bankName: '', ifsc: '' },
    ...old,
    id: id || 'emp-' + Date.now(),
    employeeCode: old?.employeeCode || 'EMS-' + (101 + (S.employees || []).length),
    ...Object.fromEntries(['firstName', 'lastName', 'email', 'phone', 'department', 'designation', 'joiningDate', 'role', 'status'].map((k) => [k, f[k]])),
    salary: { taxRate: 10, pfRate: 12, ...old?.salary, basic: +f.basic, hra: +f.hra, allowances: +f.allowances }
  };
  $('#dlg').close();
  commit('employees', id ? 'upd' : 'add', e);
}

function delEmp(id) {
  if (confirm('Are you sure you want to delete this employee and all associated attendance, leave, and payroll records?')) {
    commit('employees', 'del', id);
  }
}

function runPayroll() {
  const month = new Date().toLocaleString('en', { month: 'long', year: 'numeric' });
  const batch = (S.employees || []).filter((e) => e.status !== 'Inactive').map((e) => {
    const { basic, hra, allowances, taxRate, pfRate } = e.salary || { basic: 30000, hra: 12000, allowances: 5000, taxRate: 10, pfRate: 12 };
    const gross = basic + hra + allowances, leave = e.status === 'On Leave';
    const tax = Math.round(gross * (taxRate || 10) / 100), pf = Math.round(basic * (pfRate || 12) / 100), pen = leave ? 2100 : 0;
    return {
      id: `pay-${e.id}-${month.replace(' ', '')}`,
      employeeId: e.id,
      employeeName: name(e),
      department: e.department,
      designation: e.designation,
      month,
      payDate: today(),
      basicSalary: basic,
      hra,
      specialAllowance: allowances,
      grossSalary: gross,
      taxDeduction: tax,
      pfDeduction: pf,
      attendancePenalty: pen,
      totalDeductions: tax + pf + pen,
      netSalary: gross - tax - pf - pen,
      status: 'Paid',
      workingDays: 22,
      presentDays: leave ? 20 : 22,
      paidLeaveDays: leave ? 2 : 0
    };
  });
  commit('payroll', 'all', [...batch, ...(S.payroll || []).filter((p) => p.month !== month)]);
}

function payslip(id) {
  const p = (S.payroll || []).find((x) => x.id === id);
  if (!p) return;
  const r = (a, b) => `<tr><td>${a}<td style="text-align:right">${inr(b)}`;
  $('#dlg').innerHTML = `<h2>Payslip · ${p.month}</h2>
  <p><b>${esc(p.employeeName)}</b><br>${esc(p.designation)}, ${esc(p.department)}<br>Pay Date: ${p.payDate} · Present ${p.presentDays}/${p.workingDays} days</p>
  <table>
    ${r('Basic Salary', p.basicSalary)}
    ${r('House Rent Allowance (HRA)', p.hra)}
    ${r('Special Allowances', p.specialAllowance)}
    ${r('<b>Gross Earnings</b>', p.grossSalary)}
    ${r('Income Tax Deduction', -p.taxDeduction)}
    ${r('Provident Fund (PF)', -p.pfDeduction)}
    ${r('Attendance Penalty', -p.attendancePenalty)}
    ${r('<b>Net Disbursed Pay</b>', p.netSalary)}
  </table>
  <div class="noprint" style="margin-top:14px;text-align:right">
    <button class="g" onclick="$('#dlg').close()">Close</button>
    <button class="b" onclick="window.print()">Print Payslip</button>
  </div>`;
  $('#dlg').showModal();
}

function exportCSV() {
  const rows = [
    ['Code', 'First Name', 'Last Name', 'Email', 'Department', 'Designation', 'Role', 'Status', 'Basic Salary'],
    ...(S.employees || []).map((e) => [e.employeeCode, e.firstName, e.lastName, e.email, e.department, e.designation, e.role, e.status, e.salary?.basic || 0])
  ];
  const csvContent = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const a = Object.assign(document.createElement('a'), {
    download: `employees_${today()}.csv`,
    href: URL.createObjectURL(blob)
  });
  a.click();
}

// Arrow key navigation for slideshow
window.addEventListener('keydown', (e) => {
  if (tab === 'presentation' && slideMode === 'single') {
    if (e.key === 'ArrowRight') { slide = Math.min(SLIDES.length, slide + 1); render(); }
    if (e.key === 'ArrowLeft') { slide = Math.max(1, slide - 1); render(); }
  }
});

boot();
</script>
